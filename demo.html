<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dự Đoán Điểm Cuối Kỳ</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f7f5f0;
  font-family: 'JetBrains Mono', monospace;
}

.card {
  width: 420px;
  background: #fff;
  border: 2px solid #1a1714;
  padding: 40px 36px 36px;
  animation: up .5s ease both;
}

/* ── Header ── */
.card-label {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #8a8278;
  margin-bottom: 10px;
}

h1 {
  font-family: 'Syne', sans-serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1.15;
  margin-bottom: 4px;
}
h1 em { font-style: normal; color: #c0392b; }

.model-info {
  font-size: 10px;
  color: #8a8278;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid #e0dbd2;
  min-height: 16px;
  transition: color .3s;
  line-height: 1.6;
}
.model-info.ok  { color: #16a34a; }
.model-info.err { color: #c0392b; }

/* ── Input ── */
.input-label {
  font-size: 10px;
  color: #8a8278;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.num-input {
  width: 100%;
  font-family: 'JetBrains Mono', monospace;
  font-size: 36px;
  font-weight: 600;
  padding: 12px 16px;
  border: 1.5px solid #e0dbd2;
  background: #f7f5f0;
  color: #1a1714;
  outline: none;
  transition: border-color .2s;
  -moz-appearance: textfield;
}
.num-input::-webkit-outer-spin-button,
.num-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.num-input:focus { border-color: #1a1714; }
.num-input.err   { border-color: #c0392b; }

.range-slider {
  width: 100%;
  accent-color: #c0392b;
  margin-top: 10px;
  cursor: pointer;
}

/* ── Button ── */
.btn {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: #1a1714;
  color: #f7f5f0;
  border: none;
  cursor: pointer;
  transition: background .15s, transform .1s;
}
.btn:hover   { background: #333; }
.btn:active  { transform: scale(.98); }
.btn:disabled { background: #c0bdb8; cursor: not-allowed; }

/* ── Divider ── */
.divider {
  border: none;
  border-top: 1px solid #e0dbd2;
  margin: 28px 0;
}

/* ── Output ── */
.output-label {
  font-size: 10px;
  color: #8a8278;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.result-wrap {
  display: flex;
  align-items: baseline;
  gap: 14px;
}

.result-num {
  font-family: 'Syne', sans-serif;
  font-size: 72px;
  font-weight: 800;
  color: #c0392b;
  line-height: 1;
}
.result-num.pending { color: #e0dbd2; }
.result-num.pop { animation: pop .35s ease; }

.result-right {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.result-grade {
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 3px 10px;
  border: 1.5px solid currentColor;
  display: none;
}

.result-eq {
  font-size: 10px;
  color: #8a8278;
  line-height: 1.6;
}

/* ── Loading bar ── */
.loading-bar {
  height: 2px;
  background: linear-gradient(90deg, #c0392b, #f7f5f0, #c0392b);
  background-size: 200% 100%;
  animation: slide 1s linear infinite;
  margin-bottom: 20px;
  display: none;
}
.loading-bar.show { display: block; }

/* ── Animations ── */
@keyframes up    { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
@keyframes pop   { 0%{transform:scale(.7)} 60%{transform:scale(1.07)} 100%{transform:scale(1)} }
@keyframes slide { from{background-position:200% 0} to{background-position:-200% 0} }
</style>
</head>
<body>

<div class="card">
  <div class="loading-bar" id="loadingBar"></div>

  <div class="card-label">OLS Linear Regression</div>
  <h1>Dự Đoán<br><em>Điểm Cuối Kỳ</em></h1>
  <div class="model-info" id="modelInfo">Đang tải model.json…</div>

  <div class="input-label">Điểm giữa kỳ (0 – 10)</div>
  <input class="num-input" type="number" id="xInput"
         min="0" max="10" step="0.01" placeholder="0.00"
         oninput="syncSlider(this.value)"
         onkeydown="if(event.key==='Enter') predict()" />
  <input class="range-slider" type="range" id="xSlider"
         min="0" max="10" step="0.01" value="5"
         oninput="syncInput(this.value)" />

  <button class="btn" id="btnPredict" onclick="predict()" disabled>
    Dự đoán →
  </button>

  <hr class="divider">

  <div class="output-label">Điểm cuối kỳ dự đoán</div>
  <div class="result-wrap">
    <div class="result-num pending" id="resultNum">—</div>
    <div class="result-right">
      <span class="result-grade" id="resultGrade"></span>
      <span class="result-eq"   id="resultEq"></span>
    </div>
  </div>
</div>

<script>
let model = null;

// ── Tự động fetch model.json cùng thư mục ──
(async () => {
  const bar  = document.getElementById('loadingBar');
  const info = document.getElementById('modelInfo');
  bar.classList.add('show');

  try {
    const res = await fetch('./model.json');
    if (!res.ok) throw new Error(`HTTP ${res.status} — không tìm thấy model.json`);

    const data = await res.json();
    if (!data.parameters || data.parameters.a == null || data.parameters.b == null)
      throw new Error('model.json thiếu parameters.a hoặc parameters.b');

    model = data;

    const p    = data.parameters;
    const m    = data.metrics || {};
    const r2   = m.R2   != null ? `R²=${m.R2.toFixed(4)}` : '';
    const mae  = m.MAE  != null ? `MAE=${m.MAE.toFixed(4)}` : '';
    const date = data.trained_at ? `Huấn luyện: ${data.trained_at}` : '';

    info.innerHTML =
      `✓ model.json đã nạp<br>` +
      `ŷ = ${p.a.toFixed(6)}·x + ${p.b.toFixed(6)}<br>` +
      [r2, mae, `n=${data.n_samples || '?'}`, date].filter(Boolean).join(' · ');
    info.classList.add('ok');

    document.getElementById('btnPredict').disabled = false;

  } catch (err) {
    info.innerHTML =
      `⚠ ${err.message}<br>` +
      `Đảm bảo <b>model.json</b> nằm cùng thư mục với demo.html và mở qua web server (Live Server / http.server).`;
    info.classList.add('err');
  } finally {
    bar.classList.remove('show');
  }
})();

// ── Dự đoán ──
function predict() {
  if (!model) return;

  const x   = parseFloat(document.getElementById('xInput').value);
  const inp = document.getElementById('xInput');

  if (isNaN(x) || x < 0 || x > 10) {
    inp.classList.add('err');
    setTimeout(() => inp.classList.remove('err'), 900);
    return;
  }

  const { a, b } = model.parameters;
  const yhat = Math.min(10, Math.max(0, a * x + b));
  const yr   = yhat.toFixed(2);

  // Số kết quả — animation
  const el = document.getElementById('resultNum');
  el.textContent = yr;
  el.classList.remove('pending', 'pop');
  void el.offsetWidth;
  el.classList.add('pop');

  // Phương trình
  document.getElementById('resultEq').innerHTML =
    `ŷ = ${a.toFixed(4)} × ${x}<br>+ ${b.toFixed(4)} = <b>${yr}</b>`;

  // Xếp loại
  const g = document.getElementById('resultGrade');
  g.style.display = 'inline-block';
  if      (yhat >= 8.5) { g.textContent = 'Xuất sắc';   g.style.color = '#16a34a'; }
  else if (yhat >= 7.0) { g.textContent = 'Giỏi';       g.style.color = '#2563eb'; }
  else if (yhat >= 6.5) { g.textContent = 'Khá';        g.style.color = '#b5850a'; }
  else if (yhat >= 5.0) { g.textContent = 'Trung bình'; g.style.color = '#8a8278'; }
  else                  { g.textContent = 'Yếu / Kém';  g.style.color = '#c0392b'; }
}

function syncSlider(v) {
  document.getElementById('xSlider').value = Math.min(10, Math.max(0, parseFloat(v) || 0));
}
function syncInput(v) {
  document.getElementById('xInput').value = parseFloat(v).toFixed(2);
}
</script>
</body>
</html>
