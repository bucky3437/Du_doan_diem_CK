<title>Dự Đoán Điểm Cuối Kỳ — k-NN</title>

let model = null;

// ── Binary Search ──
function binarySearch(xs, xq) {
  let lo = 0, hi = xs.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (xs[mid] < xq) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

// ── k-NN Predict ──
function knnPredict(xq, xs, ys, k) {
  const pos = binarySearch(xs, xq);
  let left = pos - 1, right = pos;
  const nbIdx = [];
  while (nbIdx.length < k) {
    const dL = left  >= 0       ? Math.abs(xs[left]  - xq) : Infinity;
    const dR = right < xs.length ? Math.abs(xs[right] - xq) : Infinity;
    if (dL <= dR) { nbIdx.push(left);  left--;  }
    else          { nbIdx.push(right); right++; }
  }
  const yhat = nbIdx.reduce((s, i) => s + ys[i], 0) / k;
  return { yhat: Math.round(yhat * 100) / 100, nbIdx, pos };
}

(async () => {
  const bar  = document.getElementById('loadingBar');

  bar.classList.add('show');
  try {

    model = data;
    const m = data.metrics || {};
    info.innerHTML =

    info.classList.add('ok');
    document.getElementById('btnPredict').disabled = false;
  } catch (err) {
    info.innerHTML = `⚠ ${err.message}<br>Đặt model_knn.json cùng thư mục và mở qua web server.`;
    info.classList.add('err');
  } finally {
    bar.classList.remove('show');
  }
})();

// ── Predict ──
function predict() {
  const x = parseFloat(document.getElementById('xInput').value);
  const inp = document.getElementById('xInput');
  if (isNaN(x) || x < 0 || x > 10) {
    inp.classList.add('err');
    setTimeout(() => inp.classList.remove('err'), 900);
    return;
  }

  const k = model?.k ?? 5;
  const { yhat, nbIdx, pos } = knnPredict(x, XS, YS, k);
  const yr = yhat.toFixed(2);

  // Animate
  const el = document.getElementById('resultNum');
  el.textContent = yr;
  el.classList.remove('pending','pop');
  void el.offsetWidth;
  el.classList.add('pop');

  // Equation
  const ySum = nbIdx.reduce((s,i) => s + YS[i], 0);
  document.getElementById('resultEq').innerHTML =
    `ŷ = (1/${k}) × Σy_kNN<br>= (1/${k}) × ${ySum.toFixed(2)} = <b>${yr}</b>`;

  // Grade
  const g = document.getElementById('resultGrade');
  g.style.display = 'inline-block';
  if      (yhat >= 8.5) { g.textContent='Xuất sắc';   g.style.color='#16a34a'; }
  else if (yhat >= 7.0) { g.textContent='Giỏi';       g.style.color='#2563eb'; }
  else if (yhat >= 6.5) { g.textContent='Khá';        g.style.color='#b5850a'; }
  else if (yhat >= 5.0) { g.textContent='Trung bình'; g.style.color='#8a8278'; }
  else                  { g.textContent='Yếu / Kém';  g.style.color='#c0392b'; }

  // Neighbors detail
  const box = document.getElementById('neighborsBox');
  box.style.display = 'block';
  const rows = nbIdx.map(i =>
    `x=${XS[i].toFixed(2)}, y=${YS[i].toFixed(2)}, d=${Math.abs(XS[i]-x).toFixed(4)}`
  ).join('<br>');
  box.innerHTML =
    `<b>Binary Search:</b> vị trí ${pos} trong mảng đã sort<br>` +
    `<b>${k} láng giềng gần nhất:</b><br>${rows}`;
}

function syncSlider(v) { document.getElementById('xSlider').value = Math.min(10,Math.max(0,parseFloat(v)||0)); }
function syncInput(v)  { document.getElementById('xInput').value  = parseFloat(v).toFixed(2); }
document.getElementById('xInput').addEventListener('keydown', e => { if(e.key==='Enter') predict(); });
</script>
